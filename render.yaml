# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: satarksetu
    runtime: python
    plan: starter            # persistent disks need a paid plan
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm ci && npm run build
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: VOTE_SECRET
        generateValue: true
    disk:
      name: satarksetu-data
      mountPath: /var/data
      sizeGB: 1
